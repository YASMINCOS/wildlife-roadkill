# Gerado por: python scripts/01_prepare_dataset.py --raw_dir data/raw_seg --out_dir data/processed --task segment
# Ver docs/fase1_proposta.md e data/DATASET_SOURCES.md para o plano de anotação

path: data/processed/segment   # relativo à raiz do repositório (rode os scripts a partir dela)
train: images/train
val: images/val
test: images/test

names:
  0: capivara
